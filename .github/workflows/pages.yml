name: Refresh and publish PIA Atsugi viewer

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions minimum schedule interval is five minutes.
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Collect history and build static files
        run: PIA_HISTORY_DB=site_data/history.sqlite3 PIA_FORCE_COLLECT=${{ github.event_name == 'workflow_dispatch' }} python generate_static.py
      - name: Save refreshed history in Git
        id: save
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site_data/history.sqlite3 docs
          if ! git diff --cached --quiet; then
            git commit -m "Refresh PIA Atsugi history"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.changed == 'true'
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.save.outputs.changed == 'true'
